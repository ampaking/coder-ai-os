# CONTEXT engine — retrieval policy + per-layer token targets (reported by doctor).
# Token targets are advisory (the hard gate is tokens.budget in KB); doctor flags HIGH.
retrieval_order: request -> rg locate -> dependency trace if needed -> retrieve narrow ranges -> summarize -> continue
full_repository_scan: false
reuse_discovered_context: true
initial_file_limit: 5
# Enforced token ceilings (advisory in doctor). global_instruction is OUR ceiling for the
# always-loaded block — larger than the paper's ~350 minimal ideal because we deliberately
# bundle guardrails + clarify + orient + harness pointers. project/skill follow the paper.
budgets_tokens:
  global_instruction: 800
  project_instruction: 600
  skill_summary: 80
