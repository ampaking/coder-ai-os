# MEMORY lifecycle policy. File-based (markdown in the repo, git-committed) so it is portable
# across agents — switch Claude/Codex/Cursor and nothing is lost. NOT a DB/JSON (those need a
# per-agent adapter and don't travel). `--project` seeds INDEX.md (facts) + CURRENT.md (resume).
location: .ai/memory/
index: .ai/memory/INDEX.md
resume: .ai/memory/CURRENT.md
navigator: .ai/PROJECT_NAVIGATOR.md
capture: durable facts, decisions, and gotchas — one file per fact with a one-line description
prune: remove memories contradicted by the code or superseded by newer facts
checkpoint: original intent, Definition of Done, active task, decisions, changed files, next action, blockers, and observed validation
load: read INDEX.md first; resume from CURRENT.md; load a full memory only when relevant
