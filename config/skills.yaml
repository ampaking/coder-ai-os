# SKILL engine — selected, not always loaded. Only the short trigger summary is
# compiled into the block; the full SKILL.md loads on trigger (progressive disclosure).
lazy_load: true
enabled:
  - debugging
  - feature-development
  - api-change-review
  - monorepo-change
skills:
  debugging:
    trigger: failing test · runtime error · unexpected behavior
    load: skills/debugging/SKILL.md
  feature-development:
    trigger: new endpoint or component · multi-file feature
    load: skills/feature-development/SKILL.md
  api-change-review:
    trigger: public API, schema, or contract change
    load: skills/api-change-review/SKILL.md
  monorepo-change:
    trigger: monorepo change spanning packages · API/contract change affecting other packages
    load: skills/monorepo-change/SKILL.md
