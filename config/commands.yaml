# SLASH COMMANDS — compiled for every supported agent command surface.
commands:
  plan:
    description: Draft a tiered plan for the current task per AI_DEV_PROTOCOL
    body: Classify the tier, then follow only the phases and artifacts AI_DEV_PROTOCOL requires for that tier. No code before its investigation gate.
  task:
    description: Run the complete isolated task lifecycle
    body: Resume the active AI_DEV_PROTOCOL task. Re-read its original Definition of Done, execute exactly one isolated task, validate it, checkpoint CURRENT.md, and finish with the protocol review and full-goal audit.
  review:
    description: Run the review-only roles on the current diff
    body: Review as Reviewer then Security then Performance then Architecture. Compare the full diff with the original Definition of Done. Report findings with file and line only. Do not edit.
  snapshot:
    description: Regenerate the repository orientation snapshot
    body: Run scripts/update-ai-context.sh and summarize what structurally changed.
