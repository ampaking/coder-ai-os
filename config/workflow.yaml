# HOW the agent works. Toggles here switch sections on/off in the compiled output.
planning: true
atomic_tasks: true
self_review: true
delegation:
  min_tier: feature
  mode: independent read-only exploration and review only
  writes: serial in the main task
architecture_review: false
protocol_file: AI_DEV_PROTOCOL.md
clarify:
  mode: by-exception
  ask_before_large_scan: true
orient:
  strategy: query-first
  levels: L1 locate -> L2 trace -> L3 impact -> L4 repo-wide
  index: CodeGraph only for L2-L3 callers/impact
  snapshot: .ai/PROJECT_SNAPSHOT.md
