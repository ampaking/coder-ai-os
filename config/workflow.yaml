# HOW the agent works. Toggles here switch sections on/off in the compiled output.
planning: true
atomic_tasks: true
self_review: true
delegation:
  min_tier: feature
  mode: native same-provider subagents plus direct cross-provider CLI handoff
  writes: serial in the main task
native_orchestration:
  enabled: true
  entrypoints: normal claude or codex interactive session
  controller: the user-selected parent session
  routing: capability and task risk, never provider loyalty
  cross_provider: invoke the other installed native CLI directly, never through coder-ai-os run or MCP
  review: prefer the opposite provider in read-only mode; repair and re-review until clean
  questions: block only for material human decisions; otherwise state the safe assumption and continue
architecture_review: false
protocol_file: AI_DEV_PROTOCOL.md
clarify:
  mode: by-exception
  ask_before_large_scan: true
orient:
  strategy: query-first
  levels: L1 locate -> L2 trace -> L3 impact -> L4 repo-wide
  index: CodeGraph only for L2-L3 callers/impact
  snapshot: .ai/PROJECT_SNAPSHOT.md
