# HOW the agent works. Toggles here switch sections on/off in the compiled output.
planning: true
atomic_tasks: true
self_review: true
delegation:
  min_tier: feature
  mode: native same-provider subagents plus direct cross-provider CLI handoff
  writes: serial in the main task
native_orchestration:
  enabled: true
  entrypoints: normal claude or codex interactive session
  controller: the user-selected parent session
  routing: capability and task risk, never provider loyalty
  cross_provider: invoke the other installed native CLI directly, never through coder-ai run or MCP
  review: prefer the opposite provider in read-only mode; repair and re-review until clean
  questions: block only for material human decisions; otherwise state the safe assumption and continue
architecture_review: false
# Delivery: when a project declares a workflow and this machine enabled it, finish the
# job through the harness. The agent never runs git writes itself.
delivery:
  command: coder-ai ship
  declaration: .coder-ai/delivery.yaml
  rule: read the declaration, follow its order, never work around a failed step
  evidence: coder-ai prove — report its table before claiming done
# On an explicit commit request without a declared workflow: output paste-ready commands
# only (git writes stay human-run).
commit_handoff:
  max_files_per_commit: 3
  message: conventional one-liner
  monorepo_scope: true
  # Git history names the repository, never the tool that typed. `coder-ai ship`
  # enforces this in delivery/ship.py; stating it here makes a direct `git commit`
  # obey the same rule, now that the agent is permitted to run one.
  no_attribution: true
protocol_file: AI_DEV_PROTOCOL.md
clarify:
  mode: by-exception
  ask_before_large_scan: true
orient:
  strategy: query-first
  levels: L1 locate -> L2 trace -> L3 impact -> L4 repo-wide
  index: CodeGraph only for L2-L3 callers/impact
  snapshot: .ai/PROJECT_SNAPSHOT.md
